# Builds site/ and publishes it to GitHub Pages. It does nothing in a
# repository without a site/ folder, such as the shared project itself.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: site
        run: |
          if [ -f site/config.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No site/ folder, so nothing to publish."; fi
      - if: steps.site.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.site.outputs.present == 'true'
        run: npm ci && npm run build
      - if: steps.site.outputs.present == 'true'
        uses: actions/configure-pages@v5
      - if: steps.site.outputs.present == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.site.outputs.present == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
